<svg xmlns="http://www.w3.org/2000/svg" width="900" height="646" viewBox="0 0 900 646" role="img" aria-labelledby="title desc">
<title id="title">Harness 与大模型、本体的关系</title>
<desc id="desc">从上到下是三个部分：大模型，Harness，本体。大模型在最上面，标着权重。中间的 Harness 是一个大框，标着它的形式是代码和文字，修改后不需要训练。框内第一行是循环中由 Harness 完成的三个步骤：取得观测、执行动作、检查结果，任务没有完成时开始下一轮。取得观测以后，一个箭头把观测送到框外的大模型，另一个箭头把大模型的决定带回框内，接到执行动作。第二行是 Harness 的组成部分和介绍它们的章：第 2 章接口与门控，第 3 章编排，第 4 章监控与恢复，第 5 章记忆，第 6 章分层。框的下面是策略和本体，策略带有权重，包装成工具后供调用，本体是硬件。本体的相机图像和关节位置向上进入 Harness，Harness 的指令向下到达本体。左侧的大括号把三个部分括在一起，标注为智能体。</desc>
<defs>
<marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#496358" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-accent" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#8b6228" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>text{font-family:Arial, Helvetica, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif;}</style>
</defs>
<rect width="900" height="646" fill="white"/>
<rect x="20" y="20" width="860" height="606" rx="14" fill="#f6f3e9"/>
<rect x="230" y="140" width="620" height="292" rx="14" fill="#f2e7d2" stroke="#8b6228" stroke-width="1.4"/><text x="256" y="182" font-size="23" font-weight="700" fill="#183c34" text-anchor="start">Harness</text><text x="578" y="182" font-size="14.5" font-weight="400" fill="#496358" text-anchor="start">形式是代码和文字，修改后不需要训练</text><rect x="230" y="36" width="620" height="62" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="540.0" y="75" font-size="21" font-weight="600" fill="#183c34" text-anchor="middle">大模型</text><rect x="810" y="23" width="48" height="26" rx="13" fill="#183c34" stroke="#183c34" stroke-width="1"/><text x="834.0" y="41" font-size="13.5" font-weight="600" fill="white" text-anchor="middle">权重</text><rect x="346" y="223" width="108" height="42" rx="21" fill="white" stroke="#8b6228" stroke-width="1.1"/><text x="400" y="250" font-size="16.5" font-weight="400" fill="#183c34" text-anchor="middle">取得观测</text><rect x="506" y="223" width="108" height="42" rx="21" fill="white" stroke="#8b6228" stroke-width="1.1"/><text x="560" y="250" font-size="16.5" font-weight="400" fill="#183c34" text-anchor="middle">执行动作</text><rect x="666" y="223" width="108" height="42" rx="21" fill="white" stroke="#8b6228" stroke-width="1.1"/><text x="720" y="250" font-size="16.5" font-weight="400" fill="#183c34" text-anchor="middle">检查结果</text><path d="M 400 221 V 106" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="388" y="126" font-size="15" font-weight="400" fill="#496358" text-anchor="end">观测</text><path d="M 560 98 V 215" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="572" y="126" font-size="15" font-weight="400" fill="#496358" text-anchor="start">决定</text><path d="M 616 244 H 658" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 720 267 V 288 Q 720 300 708 300 H 412 Q 400 300 400 288 V 273" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="560.0" y="324" font-size="15" font-weight="400" fill="#496358" text-anchor="middle">任务没有完成时，开始下一轮循环</text><text x="256" y="362" font-size="14.5" font-weight="400" fill="#607167" text-anchor="start">第一部分各章介绍的内容</text><rect x="256" y="376" width="137" height="38" rx="8" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="274" y="401" font-size="15.5" font-weight="700" fill="#8b6228" text-anchor="middle">2</text><text x="335.5" y="401" font-size="16" font-weight="400" fill="#183c34" text-anchor="middle">接口与门控</text><rect x="402.0" y="376" width="86" height="38" rx="8" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="420.0" y="401" font-size="15.5" font-weight="700" fill="#8b6228" text-anchor="middle">3</text><text x="456.0" y="401" font-size="16" font-weight="400" fill="#183c34" text-anchor="middle">编排</text><rect x="497.0" y="376" width="137" height="38" rx="8" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="515.0" y="401" font-size="15.5" font-weight="700" fill="#8b6228" text-anchor="middle">4</text><text x="576.5" y="401" font-size="16" font-weight="400" fill="#183c34" text-anchor="middle">监控与恢复</text><rect x="643.0" y="376" width="86" height="38" rx="8" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="661.0" y="401" font-size="15.5" font-weight="700" fill="#8b6228" text-anchor="middle">5</text><text x="697.0" y="401" font-size="16" font-weight="400" fill="#183c34" text-anchor="middle">记忆</text><rect x="738.0" y="376" width="86" height="38" rx="8" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="756.0" y="401" font-size="15.5" font-weight="700" fill="#8b6228" text-anchor="middle">6</text><text x="792.0" y="401" font-size="16" font-weight="400" fill="#183c34" text-anchor="middle">分层</text><rect x="640" y="458" width="210" height="56" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="745" y="484" font-size="20" font-weight="600" fill="#183c34" text-anchor="middle">策略</text><text x="745" y="504" font-size="13.5" font-weight="400" fill="#496358" text-anchor="middle">包装成工具后供调用</text><rect x="810" y="445" width="48" height="26" rx="13" fill="#183c34" stroke="#183c34" stroke-width="1"/><text x="834.0" y="463" font-size="13.5" font-weight="600" fill="white" text-anchor="middle">权重</text><rect x="230" y="548" width="620" height="62" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="540.0" y="577" font-size="21" font-weight="600" fill="#183c34" text-anchor="middle">本体</text><text x="540.0" y="599" font-size="14.5" font-weight="400" fill="#496358" text-anchor="middle">机械臂、夹爪、相机</text><rect x="810" y="535" width="48" height="26" rx="13" fill="#183c34" stroke="#183c34" stroke-width="1"/><text x="834.0" y="553" font-size="13.5" font-weight="600" fill="white" text-anchor="middle">硬件</text><path d="M 400 548 V 440" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="388" y="496" font-size="15" font-weight="400" fill="#496358" text-anchor="end">相机图像、关节位置</text><path d="M 560 432 V 540" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="572" y="496" font-size="15" font-weight="400" fill="#496358" text-anchor="start">指令</text><path d="M 745 432 V 450" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 745 514 V 540" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 204 36 Q 184 36 184 56 V 303 Q 184 323 166 323 Q 184 323 184 343 V 590 Q 184 610 204 610" fill="none" stroke="#496358" stroke-width="1.8" stroke-linecap="round"/><text x="108" y="330" font-size="20" font-weight="600" fill="#183c34" text-anchor="middle">智能体</text>
</svg>
