<svg xmlns="http://www.w3.org/2000/svg" width="848" height="358" viewBox="0 0 848 358" role="img" aria-labelledby="title desc">
<title id="title">机器人执行任务的循环</title>
<desc id="desc">观察、决定、行动、检查四个步骤按顺时针方向用箭头连成一圈，每个步骤下面写着它在叠积木任务中的内容。决定这一步用另一种颜色标出，并列出程序、策略、大模型三种做法。</desc>
<defs>
<marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#496358" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-accent" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#8b6228" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>text{font-family:Arial, Helvetica, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif;}</style>
</defs>
<rect width="848" height="358" fill="white"/>
<rect x="20" y="20" width="808" height="318" rx="14" fill="#f6f3e9"/>
<rect x="52" y="50" width="340" height="104" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="76" y="93" font-size="22" font-weight="600" fill="#183c34" text-anchor="start">观察</text><text x="76" y="126" font-size="15.5" font-weight="400" fill="#496358" text-anchor="start">相机拍到三块积木的位置</text><rect x="456" y="50" width="340" height="104" rx="10" fill="#f2e7d2" stroke="#8b6228" stroke-width="1.4"/><text x="480" y="93" font-size="22" font-weight="600" fill="#183c34" text-anchor="start">决定</text><text x="480" y="126" font-size="15.5" font-weight="400" fill="#496358" text-anchor="start">先抓红色积木，放到绿色积木上</text><rect x="570" y="70" width="58" height="32" rx="16" fill="white" stroke="#8b6228" stroke-width="1.1"/><text x="599.0" y="92" font-size="14.5" font-weight="600" fill="#8b6228" text-anchor="middle">程序</text><rect x="636" y="70" width="58" height="32" rx="16" fill="white" stroke="#8b6228" stroke-width="1.1"/><text x="665.0" y="92" font-size="14.5" font-weight="600" fill="#8b6228" text-anchor="middle">策略</text><rect x="702" y="70" width="74" height="32" rx="16" fill="white" stroke="#8b6228" stroke-width="1.1"/><text x="739.0" y="92" font-size="14.5" font-weight="600" fill="#8b6228" text-anchor="middle">大模型</text><rect x="456" y="204" width="340" height="104" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="480" y="247" font-size="22" font-weight="600" fill="#183c34" text-anchor="start">行动</text><text x="480" y="280" font-size="15.5" font-weight="400" fill="#496358" text-anchor="start">移动机械臂，闭合夹爪，抬起，放下</text><rect x="52" y="204" width="340" height="104" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="76" y="247" font-size="22" font-weight="600" fill="#183c34" text-anchor="start">检查</text><text x="76" y="280" font-size="15.5" font-weight="400" fill="#496358" text-anchor="start">红色积木是否稳定地放在绿色积木上</text><path d="M 400 102 H 446" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 626 162 V 194" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 448 256 H 402" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 222 196 V 164" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>
