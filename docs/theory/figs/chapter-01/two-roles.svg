62" height="38" rx="19" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="174.0" y="306.0" font-size="17" font-weight="600" fill="#183c34" text-anchor="middle">检查</text><text x="300" y="278.0" font-size="14.5" font-weight="400" fill="#607167" text-anchor="middle">作用于</text><rect x="251.0" y="292.0" width="98" height="36" rx="8" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="300" y="316.0" font-size="16.5" font-weight="400" fill="#183c34" text-anchor="middle">任务环境</text><text x="300" y="490" font-size="23" font-weight="700" fill="#183c34" text-anchor="middle">智能体即是机器人</text><text x="300" y="518" font-size="15.5" font-weight="400" fill="#496358" text-anchor="middle">执行任务时</text><path d="M 963.0 190.9 A 126 126 0 0 1 1026.0 300.0" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 963.0 409.1 A 126 126 0 0 1 837.0 409.1" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 774.0 300.0 A 126 126 0 0 1 837.0 190.9" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="852.0" y="155.0" width="96" height="38" rx="19" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="900.0" y="180.0" font-size="17" font-weight="600" fill="#183c34" text-anchor="middle">分析失败</text><rect x="935.6192008768393" y="344.0" width="147" height="38" rx="19" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="1009.1192008768393" y="369.0" font-size="17" font-weight="600" fill="#183c34" text-anchor="middle">修改技能或权重</text><rect x="742.8807991231607" y="344.0" width="96" height="38" rx="19" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="790.8807991231607" y="369.0" font-size="17" font-weight="600" fill="#183c34" text-anchor="middle">验证修改</text><text x="900" y="255.0" font-size="14.5" font-weight="400" fill="#607167" text-anchor="middle">作用于</text><rect x="868.0" y="269.0" width="64" height="36" rx="8" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="900" y="293.0" font-size="16.5" font-weight="400" fill="#183c34" text-anchor="middle">技能</text><rect x="868.0" y="315.0" width="64" height="36" rx="8" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="900" y="339.0" font-size="16.5" font-weight="400" fill="#183c34" text-anchor="middle">权重</text><text x="900" y="490" font-size="23" font-weight="700" fill="#183c34" text-anchor="middle">智能体改进机器人</text><text x="900" y="518" font-size="15.5" font-weight="400" fill="#496358" text-anchor="middle">任务之外</text><path d="M 470 270 H 724" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="600" y="258" font-size="15.5" font-weight="400" fill="#496358" text-anchor="middle">执行记录</text><path d="M 730 330 H 476" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="600" y="356" font-size="15.5" font-weight="400" fill="#496358" text-anchor="middle">更新后的技能和权重</text>
</svg>
