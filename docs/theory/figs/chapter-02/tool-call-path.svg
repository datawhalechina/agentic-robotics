<svg xmlns="http://www.w3.org/2000/svg" width="780" height="616" viewBox="0 0 780 616" role="img" aria-labelledby="title desc">
<title id="title">一次工具调用经过的各个部分</title>
<desc id="desc">从上到下是大模型、Harness 和本体三个部分。大模型标着权重，本体标着硬件。Harness 的框内从上到下是门控、工具和控制程序。大模型给出工具的名称和参数，先到门控。通过门控以后，工具把目标位置交给控制程序，控制程序向本体发出电机指令。本体的传感器读数向上回到控制程序，控制程序把实际到达的位置交给工具，工具把结果返回给大模型。没有通过门控的调用不再向下，原因直接返回给大模型。</desc>
<defs>
<marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#496358" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-accent" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#8b6228" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>text{font-family:Arial, Helvetica, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif;}</style>
</defs>
<rect width="780" height="616" fill="white"/>
<rect x="20" y="20" width="740" height="576" rx="14" fill="#f6f3e9"/>
<rect x="90" y="150" width="600" height="312" rx="14" fill="#f2e7d2" stroke="#8b6228" stroke-width="1.4"/><text x="116" y="184" font-size="23" font-weight="700" fill="#183c34" text-anchor="start">Harness</text><rect x="240.0" y="44" width="300" height="60" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="390.0" y="71" font-size="20" font-weight="600" fill="#183c34" text-anchor="middle">大模型</text><text x="390.0" y="92" font-size="14.5" font-weight="400" fill="#496358" text-anchor="middle">决定调用哪个工具</text><rect x="500.0" y="31" width="48" height="26" rx="13" fill="#183c34" stroke="#183c34" stroke-width="1"/><text x="524.0" y="49" font-size="13.5" font-weight="600" fill="white" text-anchor="middle">权重</text><rect x="240.0" y="196" width="300" height="60" rx="10" fill="white" stroke="#8b6228" stroke-width="2"/><text x="390.0" y="223" font-size="20" font-weight="600" fill="#183c34" text-anchor="middle">门控</text><text x="390.0" y="244" font-size="14.5" font-weight="400" fill="#496358" text-anchor="middle">执行之前检查这次调用</text><rect x="240.0" y="286" width="300" height="60" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="390.0" y="313" font-size="20" font-weight="600" fill="#183c34" text-anchor="middle">工具</text><text x="390.0" y="334" font-size="14.5" font-weight="400" fill="#496358" text-anchor="middle">例如 move_gripper</text><rect x="240.0" y="376" width="300" height="60" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="390.0" y="403" font-size="20" font-weight="600" fill="#183c34" text-anchor="middle">控制程序</text><text x="390.0" y="424" font-size="14.5" font-weight="400" fill="#496358" text-anchor="middle">例如逆运动学和运动规划</text><rect x="240.0" y="512" width="300" height="60" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="390.0" y="539" font-size="20" font-weight="600" fill="#183c34" text-anchor="middle">本体</text><text x="390.0" y="560" font-size="14.5" font-weight="400" fill="#496358" text-anchor="middle">机械臂、夹爪、相机</text><rect x="500.0" y="499" width="48" height="26" rx="13" fill="#183c34" stroke="#183c34" stroke-width="1"/><text x="524.0" y="517" font-size="13.5" font-weight="600" fill="white" text-anchor="middle">硬件</text><path d="M 350.0 104 V 188" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="362.0" y="134" font-size="15" font-weight="400" fill="#496358" text-anchor="start">工具的名称和参数</text><path d="M 350.0 256 V 278" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="338.0" y="273" font-size="15" font-weight="400" fill="#496358" text-anchor="end">通过</text><path d="M 350.0 346 V 368" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="338.0" y="363" font-size="15" font-weight="400" fill="#496358" text-anchor="end">目标位置</text><path d="M 350.0 436 V 504" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="338.0" y="488" font-size="15" font-weight="400" fill="#496358" text-anchor="end">发给电机的指令</text><path d="M 430.0 512 V 444" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="442.0" y="488" font-size="15" font-weight="400" fill="#496358" text-anchor="start">传感器的读数</text><path d="M 430.0 376 V 354" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="442.0" y="369" font-size="15" font-weight="400" fill="#496358" text-anchor="start">实际到达的位置</text><path d="M 540.0 316 H 588.0 Q 600.0 316 600.0 304 V 86 Q 600.0 74 588.0 74 H 548.0" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="612.0" y="112" font-size="15" font-weight="400" fill="#496358" text-anchor="start">返回结果</text><path d="M 290.0 196 V 112" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="278.0" y="134" font-size="15" font-weight="400" fill="#496358" text-anchor="end">没有通过，返回原因</text>
</svg>
