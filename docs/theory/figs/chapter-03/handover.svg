<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="478" viewBox="0 0 1200 478" role="img" aria-labelledby="title desc">
<title id="title">交出一段动作的两种方式</title>
<desc id="desc">左右两幅，时间自上而下，粗线表示控制权归谁。左边是作为工具调用：大模型和策略各一条竖线，粗线一直在大模型一侧。大模型调用策略，策略完成一段动作后返回结果，大模型继续决定。右边是任务转移：大模型和机器人自带的功能各一条竖线，粗线开始在大模型一侧，转移以后转到自带的功能一侧，它自己运行，直到结束或被停止，大模型不再逐步决定。</desc>
<defs>
<marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#496358" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-accent" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#8b6228" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>text{font-family:Arial, Helvetica, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif;}</style>
</defs>
<rect width="1200" height="478" fill="white"/>
<rect x="20" y="20" width="1160" height="438" rx="14" fill="#f6f3e9"/>
<text x="330" y="52" font-size="21" font-weight="700" fill="#183c34" text-anchor="middle">作为工具调用</text><text x="330" y="77" font-size="15" font-weight="400" fill="#496358" text-anchor="middle">控制权一直在大模型</text><rect x="130" y="112" width="160" height="46" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="210" y="142" font-size="19" font-weight="600" fill="#183c34" text-anchor="middle">大模型</text><rect x="250" y="99" width="48" height="26" rx="13" fill="#183c34" stroke="#183c34" stroke-width="1"/><text x="274.0" y="117" font-size="13.5" font-weight="600" fill="white" text-anchor="middle">权重</text><rect x="370" y="112" width="160" height="46" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="450" y="142" font-size="19" font-weight="600" fill="#183c34" text-anchor="middle">策略</text><rect x="490" y="99" width="48" height="26" rx="13" fill="#183c34" stroke="#183c34" stroke-width="1"/><text x="514.0" y="117" font-size="13.5" font-weight="600" fill="white" text-anchor="middle">权重</text><path d="M 210 158 V 408" stroke="#94a99a" stroke-width="1.6"/><path d="M 450 158 V 408" stroke="#94a99a" stroke-width="1.6"/><rect x="204" y="164" width="12" height="244" rx="6" fill="#8b6228"/><path d="M 222 222 H 440" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="330.0" y="212" font-size="15" font-weight="400" fill="#496358" text-anchor="middle">调用</text><rect x="384" y="240" width="132" height="52" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="450" y="271" font-size="15.5" font-weight="400" fill="#183c34" text-anchor="middle">完成一段动作</text><path d="M 440 312 H 224" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="330.0" y="334" font-size="15" font-weight="400" fill="#496358" text-anchor="middle">返回结果</text><text x="190" y="194" font-size="15" font-weight="400" fill="#496358" text-anchor="end">决定</text><text x="190" y="364" font-size="15" font-weight="400" fill="#496358" text-anchor="end">继续决定</text><text x="910" y="52" font-size="21" font-weight="700" fill="#183c34" text-anchor="middle">任务转移</text><text x="910" y="77" font-size="15" font-weight="400" fill="#496358" text-anchor="middle">对方接管</text><rect x="710" y="112" width="160" height="46" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="790" y="142" font-size="19" font-weight="600" fill="#183c34" text-anchor="middle">大模型</text><rect x="830" y="99" width="48" height="26" rx="13" fill="#183c34" stroke="#183c34" stroke-width="1"/><text x="854.0" y="117" font-size="13.5" font-weight="600" fill="white" text-anchor="middle">权重</text><rect x="950" y="112" width="160" height="46" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="1030" y="142" font-size="19" font-weight="600" fill="#183c34" text-anchor="middle">自带的功能</text><path d="M 790 158 V 408" stroke="#94a99a" stroke-width="1.6"/><path d="M 1030 158 V 408" stroke="#94a99a" stroke-width="1.6"/><rect x="784" y="164" width="12" height="64" rx="6" fill="#8b6228"/><rect x="1024" y="216" width="12" height="192" rx="6" fill="#8b6228"/><path d="M 802 222 H 1016" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="910.0" y="212" font-size="15" font-weight="400" fill="#496358" text-anchor="middle">转移</text><text x="770" y="194" font-size="15" font-weight="400" fill="#496358" text-anchor="end">决定</text><text x="770" y="324" font-size="15" font-weight="400" fill="#496358" text-anchor="end">不再逐步决定</text><text x="1010" y="308" font-size="15" font-weight="400" fill="#496358" text-anchor="end">自己运行</text><text x="1010" y="330" font-size="15" font-weight="400" fill="#496358" text-anchor="end">直到结束或被停止</text><path d="M 600 44 V 416" stroke="#94a99a" stroke-width="1.2" stroke-dasharray="4 6"/><rect x="548" y="436" width="44" height="12" rx="6" fill="#8b6228"/><text x="604" y="448" font-size="15" font-weight="400" fill="#496358" text-anchor="start">控制权</text>
</svg>
