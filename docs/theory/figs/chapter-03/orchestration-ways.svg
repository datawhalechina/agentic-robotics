<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="404" viewBox="0 0 1200 404" role="img" aria-labelledby="title desc">
<title id="title">三种编排方式</title>
<desc id="desc">三条时间线，从同一个开始执行的时刻出发，各有编号 1 到 8 的八次工具调用。第一条是由代码编排：开始之前已经有一段程序，八次调用一个接一个，最先完成。第二条是由大模型编排：每次调用之前大模型都做一次决定，最晚完成。第三条是大模型每次给出一段：大模型做一次决定，接着执行四次调用，再做一次决定，再执行四次，完成的时间在前两条之间。</desc>
<defs>
<marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#496358" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-accent" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#8b6228" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>text{font-family:Arial, Helvetica, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif;}</style>
</defs>
<rect width="1200" height="404" fill="white"/>
<rect x="20" y="20" width="1160" height="364" rx="14" fill="#f6f3e9"/>
<text x="372" y="58" font-size="14.5" font-weight="400" fill="#496358" text-anchor="middle">开始执行</text><path d="M 372 68 V 336" stroke="#94a99a" stroke-width="1.4" stroke-dasharray="4 6"/><path d="M 432 53 H 1140" fill="none" stroke="#94a99a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/><text x="1150" y="58" font-size="14.5" font-weight="400" fill="#496358" text-anchor="start">时间</text><text x="48" y="110" font-size="19" font-weight="600" fill="#183c34" text-anchor="start">由代码编排</text><text x="48" y="134" font-size="14" font-weight="400" fill="#496358" text-anchor="start">顺序写在程序里</text><text x="48" y="202" font-size="19" font-weight="600" fill="#183c34" text-anchor="start">由大模型编排</text><text x="48" y="226" font-size="14" font-weight="400" fill="#496358" text-anchor="start">每个步骤之前做一次决定</text><text x="48" y="294" font-size="19" font-weight="600" fill="#183c34" text-anchor="start">大模型每次给出一段</text><text x="48" y="318" font-size="14" font-weight="400" fill="#496358" text-anchor="start">每一段之前做一次决定</text><rect x="276" y="92" width="76" height="40" rx="8" fill="#183c34" stroke="#183c34" stroke-width="1.4"/><text x="314" y="118" font-size="15" font-weight="600" fill="white" text-anchor="middle">程序</text><rect x="392" y="92" width="40" height="40" rx="8" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="412" y="117" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">1</text><rect x="440" y="92" width="40" height="40" rx="8" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="460" y="117" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">2</text><rect x="488" y="92" width="40" height="40" rx="8" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="508" y="117" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">3</text><rect x="536" y="92" width="40" height="40" rx="8" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="556" y="117" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">4</text><rect x="584" y="92" width="40" height="40" rx="8" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="604" y="117" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">5</text><rect x="632" y="92" width="40" height="40" rx="8" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="652" y="117" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">6</text><rect x="680" y="92" width="40" height="40" rx="8" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="700" y="117" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">7</text><rect x="728" y="92" width="40" height="40" rx="8" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="748" y="117" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">8</text><circle cx="407" cy="204" r="13" fill="#f2e7d2" stroke="#8b6228" stroke-width="1.6"/><rect x="430" y="184" width="40" height="40" rx="8" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="450" y="209" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">1</text><circle cx="499" cy="204" r="13" fill="#f2e7d2" stroke="#8b6228" stroke-width="1.6"/><rect x="522" y="184" width="40" height="40" rx="8" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="542" y="209" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">2</text><circle cx="591" cy="204" r="13" fill="#f2e7d2" stroke="#8b6228" stroke-width="1.6"/><rect x="614" y="184" width="40" height="40" rx="8" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="634" y="209" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">3</text><circle cx="683" cy="204" r="13" fill="#f2e7d2" stroke="#8b6228" stroke-width="1.6"/><rect x="706" y="184" width="40" height="40" rx="8" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="726" y="209" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">4</text><circle cx="775" cy="204" r="13" fill="#f2e7d2" stroke="#8b6228" stroke-width="1.6"/><rect x="798" y="184" width="40" height="40" rx="8" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="818" y="209" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">5</text><circle cx="867" cy="204" r="13" fill="#f2e7d2" stroke="#8b6228" stroke-width="1.6"/><rect x="890" y="184" width="40" height="40" rx="8" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="910" y="209" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">6</text><circle cx="959" cy="204" r="13" fill="#f2e7d2" stroke="#8b6228" stroke-width="1.6"/><rect x="982" y="184" width="40" height="40" rx="8" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="1002" y="209" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">7</text><circle cx="1051" cy="204" r="13" fill="#f2e7d2" stroke="#8b6228" stroke-width="1.6"/><rect x="1074" y="184" width="40" height="40" rx="8" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="1094" y="209" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">8</text><circle cx="407" cy="296" r="13" fill="#f2e7d2" stroke="#8b6228" stroke-width="1.6"/><rect x="430" y="276" width="40" height="40" rx="8" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="450" y="301" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">1</text><rect x="478" y="276" width="40" height="40" rx="8" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="498" y="301" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">2</text><rect x="526" y="276" width="40" height="40" rx="8" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="546" y="301" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">3</text><rect x="574" y="276" width="40" height="40" rx="8" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="594" y="301" font-size="14" font-weight="400" fill="#496358" text-anchor