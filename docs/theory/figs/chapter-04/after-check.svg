<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="528" viewBox="0 0 1200 528" role="img" aria-labelledby="title desc">
<title id="title">检查之后的处理流程</title>
<desc id="desc">流程从左上角开始，先执行动作，再检查。检查的结果有三种，各占一行。第一行是达到效果，进入下一个步骤，这是通常的路线，用粗线画出。第二行是失败：先重新观测，再判断是否还能恢复、次数是否已经用完，次数的上限是预先规定的；还能恢复时，由大模型选择恢复的办法，可以重试、更换做法、回到已知的状态或者降低目标，然后按选定的办法再执行；不能恢复或者次数用完时，停止并记录原因。第三行是未知：先查询状态或者重新观测，得到了结果就重新判断，仍然不清楚就停止并记录原因，也可以请操作者处理。</desc>
<defs>
<marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#496358" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-accent" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#8b6228" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>text{font-family:Arial, Helvetica, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif;}</style>
</defs>
<rect width="1200" height="528" fill="white"/>
<rect x="20" y="20" width="1160" height="488" rx="14" fill="#f6f3e9"/>
<defs><marker id="arrow-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#183c34" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><circle cx="140" cy="50" r="6.5" fill="#183c34"/><text x="156" y="55.5" font-size="15" font-weight="400" fill="#496358" text-anchor="start">开始</text><path d="M 140 58 V 78" fill="none" stroke="#183c34" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="50" y="84" width="180" height="50" rx="10" fill="white" stroke="#183c34" stroke-width="2.2"/><text x="140.0" y="115.0" font-size="17.5" font-weight="600" fill="#183c34" text-anchor="middle">执行动作</text><path d="M 140 134 V 168" fill="none" stroke="#183c34" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="50" y="176" width="180" height="50" rx="10" fill="#183c34" stroke="#183c34" stroke-width="1.4"/><text x="140.0" y="207.0" font-size="17.5" font-weight="700" fill="white" text-anchor="middle">检查</text><path d="M 230 201 H 360" fill="none" stroke="#183c34" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="370" y="176" width="220" height="50" rx="10" fill="white" stroke="#183c34" stroke-width="2.2"/><text x="480.0" y="207.0" font-size="17.5" font-weight="600" fill="#183c34" text-anchor="middle">进入下一个步骤</text><path d="M 140 226 V 420 H 362" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 140 310 H 362" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="251.0" y="186" width="90" height="30" rx="15" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="296" y="206.5" font-size="15" font-weight="600" fill="#183c34" text-anchor="middle">达到效果</text><rect x="267.0" y="295" width="58" height="30" rx="15" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="296" y="315.5" font-size="15" font-weight="600" fill="#183c34" text-anchor="middle">失败</text><rect x="267.0" y="405" width="58" height="30" rx="15" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="296" y="425.5" font-size="15" font-weight="600" fill="#183c34" text-anchor="middle">未知</text><rect x="370" y="285" width="140" height="50" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="440.0" y="316.0" font-size="17.5" font-weight="400" fill="#183c34" text-anchor="middle">重新观测</text><path d="M 510 310 H 552" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="560" y="278" width="250" height="64" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="685.0" y="306.0" font-size="17.5" font-weight="400" fill="#183c34" text-anchor="middle">还能恢复，次数也没有用完？</text><text x="685.0" y="329.0" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">次数的上限预先规定</text><path d="M 810 310 H 852" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="831" y="300" font-size="15" font-weight="400" fill="#496358" text-anchor="middle">是</text><rect x="860" y="274" width="300" height="72" rx="10" fill="#f2e7d2" stroke="#8b6228" stroke-width="1.4"/><text x="1010.0" y="306.0" font-size="17.5" font-weight="400" fill="#183c34" text-anchor="middle">大模型选择恢复的办法</text><text x="1010.0" y="329.0" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">重试，更换做法，回到已知的状态，降低目标</text><path d="M 1010 274 V 109 H 238" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="630" y="99" font-size="15" font-weight="400" fill="#496358" text-anchor="middle">按选定的办法再执行</text><path d="M 685 342 V 420" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round"/><circle cx="685" cy="420" r="4" fill="#496358"/><text x="697" y="384" font-size="15" font-weight="400" fill="#496358" text-anchor="start">否</text><rect x="370" y="395" width="220" height="50" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="480.0" y="426.0" font-size="17.5" font-weight="400" fill="#183c34" text-anchor="middle">查询状态，或者重新观测</text><path d="M 590 420 H 852" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="637" y="410" font-size="15" font-weight="400" fill="#496358" text-anchor="middle">仍然不清楚</text><rect x="860" y="384" width="300" height="72" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="1010.0" y="416.0" font-size="17.5" font-weight="600" fill="#183c34" text-anchor="middle">停止，记录原因</text><text x="1010.0" y="439.0" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">也可以请操作者处理</text><path d="M 430 445 V 482 H 90 V 234" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="2 7" marker-end="url(#arrow)"/><text x="260" y="474" font-size="15" font-weight="400" fill="#496358" text-anchor="middle">得到了结果，重新判断</text><rect x="916" y="482" width="30" height="22" rx="5" fill="#f2e7d2" stroke="#8b6228" stroke-width="1.4"/><text x="956" y="499" font-size="14.5" font-weight="400" fill="#496358" text-anchor="start">由大模型作出的选择</text>
</svg>
