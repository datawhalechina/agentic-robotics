<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="476" viewBox="0 0 1200 476" role="img" aria-labelledby="title desc">
<title id="title">从调用工具到达到效果的时间线</title>
<desc id="desc">一条从左到右的时间线。起点是调用工具，随后依次是三个环节：请求被受理，依据是回执，例子是 accepted 为真；动作执行结束，依据是完成信号或者查询状态，例子是夹爪停止运动；达到预期的效果，依据是动作之后的观测，例子是夹爪停在积木的宽度上。第一个环节和第二个环节之间是机器人执行动作的时间。时间线下面是三个时机的检查：执行之前检查前提此时是否成立，执行过程中检查动作是否在正常进行，执行之后检查预期的效果是否达到。</desc>
<defs>
<marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#496358" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-accent" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#8b6228" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>text{font-family:Arial, Helvetica, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif;}</style>
</defs>
<rect width="1200" height="476" fill="white"/>
<rect x="20" y="20" width="1160" height="436" rx="14" fill="#f6f3e9"/>
<text x="48" y="58" font-size="15" font-weight="400" fill="#607167" text-anchor="start">环节和依据</text><path d="M 170 150 H 1140" fill="none" stroke="#94a99a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/><text x="1150" y="155" font-size="14.5" font-weight="400" fill="#496358" text-anchor="start">时间</text><rect x="420" y="145" width="370" height="10" rx="5" fill="#183c34"/><text x="605.0" y="132" font-size="14.5" font-weight="400" fill="#496358" text-anchor="middle">机器人执行动作</text><circle cx="170" cy="150" r="6" fill="white" stroke="#496358" stroke-width="1.8"/><text x="170" y="118" font-size="16" font-weight="400" fill="#496358" text-anchor="middle">调用工具</text><circle cx="420" cy="150" r="15" fill="#f2e7d2" stroke="#8b6228" stroke-width="1.6"/><text x="420" y="155.5" font-size="15" font-weight="700" fill="#8b6228" text-anchor="middle">1</text><text x="420" y="118" font-size="19" font-weight="600" fill="#183c34" text-anchor="middle">请求被受理</text><text x="420" y="196" font-size="16" font-weight="400" fill="#183c34" text-anchor="middle">依据：回执</text><text x="420" y="220" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">accepted 为真</text><circle cx="790" cy="150" r="15" fill="#f2e7d2" stroke="#8b6228" stroke-width="1.6"/><text x="790" y="155.5" font-size="15" font-weight="700" fill="#8b6228" text-anchor="middle">2</text><text x="790" y="118" font-size="19" font-weight="600" fill="#183c34" text-anchor="middle">动作执行结束</text><text x="790" y="196" font-size="16" font-weight="400" fill="#183c34" text-anchor="middle">依据：完成信号，或者查询状态</text><text x="790" y="220" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">夹爪停止运动</text><circle cx="1040" cy="150" r="15" fill="#f2e7d2" stroke="#8b6228" stroke-width="1.6"/><text x="1040" y="155.5" font-size="15" font-weight="700" fill="#8b6228" text-anchor="middle">3</text><text x="1040" y="118" font-size="19" font-weight="600" fill="#183c34" text-anchor="middle">达到预期的效果</text><text x="1040" y="196" font-size="16" font-weight="400" fill="#183c34" text-anchor="middle">依据：动作之后的观测</text><text x="1040" y="220" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">夹爪停在积木的宽度上</text><text x="48" y="286" font-size="15" font-weight="400" fill="#607167" text-anchor="start">检查的时机</text><path d="M 170 236 V 298" stroke="#94a99a" stroke-width="1.2" stroke-dasharray="4 6"/><path d="M 420 236 V 298" stroke="#94a99a" stroke-width="1.2" stroke-dasharray="4 6"/><path d="M 790 236 V 298" stroke="#94a99a" stroke-width="1.2" stroke-dasharray="4 6"/><path d="M 1140 236 V 298" stroke="#94a99a" stroke-width="1.2" stroke-dasharray="4 6"/><rect x="176" y="300" width="238" height="118" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="295.0" y="332" font-size="18" font-weight="600" fill="#183c34" text-anchor="middle">执行之前</text><text x="295.0" y="359" font-size="15.5" font-weight="400" fill="#183c34" text-anchor="middle">前提此时是否成立</text><text x="295.0" y="384" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">夹爪是空的</text><text x="295.0" y="405" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">积木的位置是不久前测得的</text><rect x="426" y="300" width="358" height="118" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="605.0" y="332" font-size="18" font-weight="600" fill="#183c34" text-anchor="middle">执行过程中</text><text x="605.0" y="359" font-size="15.5" font-weight="400" fill="#183c34" text-anchor="middle">动作是否在正常进行</text><text x="605.0" y="384" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">没有偏离路线，没有停滞</text><text x="605.0" y="405" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">物体没有掉落，没有超过规定的时间</text><rect x="796" y="300" width="338" height="118" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="965.0" y="332" font-size="18" font-weight="600" fill="#183c34" text-anchor="middle">执行之后</text><text x="965.0" y="359" font-size="15.5" font-weight="400" fill="#183c34" text-anchor="middle">预期的效果是否达到</text><text x="965.0" y="384" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">夹爪停在积木的宽度上</text><text x="965.0" y="405" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">积木留在预定的位置</text>
</svg>
