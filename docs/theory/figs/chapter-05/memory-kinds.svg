<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="566" viewBox="0 0 1200 566" role="img" aria-labelledby="title desc">
<title id="title">记忆的三种内容</title>
<desc id="desc">从上到下是大模型、Harness 和本体三个部分，画法与图 1.3 相同。Harness 的框里并排有三个方框。左边是历史，记的是观测、调用和结果，本体的观测每一轮追加进去，属于短期记忆。中间是状态，记的是环境事实和任务进度，用历史里新的内容更新，也属于短期记忆，一条粗箭头从状态指向大模型，表示每一轮都放进输入。右边是经验，是从以往的任务里总结出来的，属于长期记忆，从中选出有关的几条放进大模型的输入。一条虚线从历史指向大模型，表示需要时再查。</desc>
<defs>
<marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#496358" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-accent" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#8b6228" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>text{font-family:Arial, Helvetica, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif;}</style>
</defs>
<rect width="1200" height="566" fill="white"/>
<rect x="20" y="20" width="1160" height="526" rx="14" fill="#f6f3e9"/>
<defs><marker id="arrow-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#183c34" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="90" y="150" width="1020" height="254" rx="14" fill="#f2e7d2" stroke="#8b6228" stroke-width="1.4"/><text x="660" y="196" font-size="23" font-weight="700" fill="#183c34" text-anchor="start">Harness</text><rect x="90" y="40" width="1020" height="62" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="600.0" y="79" font-size="21" font-weight="600" fill="#183c34" text-anchor="middle">大模型</text><rect x="1070" y="27" width="48" height="26" rx="13" fill="#183c34" stroke="#183c34" stroke-width="1"/><text x="1094.0" y="45" font-size="13.5" font-weight="600" fill="white" text-anchor="middle">权重</text><rect x="90" y="466" width="1020" height="62" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="600.0" y="495" font-size="21" font-weight="600" fill="#183c34" text-anchor="middle">本体</text><text x="600.0" y="517" font-size="14.5" font-weight="400" fill="#496358" text-anchor="middle">机械臂、夹爪、相机</text><rect x="1070" y="453" width="48" height="26" rx="13" fill="#183c34" stroke="#183c34" stroke-width="1"/><text x="1094.0" y="471" font-size="13.5" font-weight="600" fill="white" text-anchor="middle">硬件</text><rect x="150" y="262" width="240" height="72" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="270.0" y="293" font-size="20" font-weight="600" fill="#183c34" text-anchor="middle">历史</text><text x="270.0" y="317" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">观测、调用和结果</text><text x="384" y="354" font-size="13.5" font-weight="400" fill="#607167" text-anchor="end">短期记忆</text><rect x="480" y="262" width="240" height="72" rx="10" fill="white" stroke="#183c34" stroke-width="2.4"/><text x="600.0" y="293" font-size="20" font-weight="600" fill="#183c34" text-anchor="middle">状态</text><text x="600.0" y="317" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">环境事实，任务进度</text><text x="714" y="354" font-size="13.5" font-weight="400" fill="#607167" text-anchor="end">短期记忆</text><rect x="830" y="262" width="220" height="72" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="940.0" y="293" font-size="20" font-weight="600" fill="#183c34" text-anchor="middle">经验</text><text x="940.0" y="317" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">从以往的任务里总结出来</text><text x="1044" y="354" font-size="13.5" font-weight="400" fill="#607167" text-anchor="end">长期记忆</text><path d="M 230 466 V 342" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="242" y="440" font-size="15" font-weight="400" fill="#496358" text-anchor="start">观测，每一轮追加</text><path d="M 390 298 H 472" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="431" y="288" font-size="15" font-weight="400" fill="#496358" text-anchor="middle">更新</text><path d="M 600 262 V 110" fill="none" stroke="#183c34" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/><text x="586" y="216" font-size="15" font-weight="600" fill="#183c34" text-anchor="end">每一轮都放进输入</text><path d="M 330 262 V 110" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="2 7" marker-end="url(#arrow)"/><text x="318" y="206" font-size="15" font-weight="400" fill="#496358" text-anchor="end">需要时</text><text x="318" y="227" font-size="15" font-weight="400" fill="#496358" text-anchor="end">再查</text><path d="M 940 262 V 110" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="954" y="206" font-size="15" font-weight="400" fill="#496358" text-anchor="start">选出有关的</text><text x="954" y="227" font-size="15" font-weight="400" fill="#496358" text-anchor="start">几条放进输入</text>
</svg>
