<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">从执行记录到经验</title>
<desc id="desc">一条从左到右的流程。任务结束以后，先有执行记录，它是一次任务的完整经过。第一步是提取，从执行记录里得到这一次总结的内容，例如失败的原因和奏效的做法。第二步是整合，把这一次总结的内容和已有的经验放在一起，重复的合并，矛盾的以较新的为准，不再适用的删掉，得到经验。经验写成带条件的做法，留给以后的任务使用。一条虚线从经验回到执行记录，表示每一条经验注明出自哪一次任务，发现问题时回到记录去核对。</desc>
<defs>
<marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#496358" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-accent" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#8b6228" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>text{font-family:Arial, Helvetica, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif;}</style>
</defs>
<rect width="1200" height="330" fill="white"/>
<rect x="20" y="20" width="1160" height="290" rx="14" fill="#f6f3e9"/>
<circle cx="64" cy="160" r="6.5" fill="#183c34"/><text x="64" y="134" font-size="15" font-weight="400" fill="#496358" text-anchor="middle">任务结束</text><path d="M 74 160 H 112" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="120" y="124" width="220" height="72" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="230.0" y="155" font-size="19" font-weight="600" fill="#183c34" text-anchor="middle">执行记录</text><text x="230.0" y="179" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">一次任务的完整经过</text><path d="M 340 160 H 442" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="391" y="150" font-size="15.5" font-weight="600" fill="#183c34" text-anchor="middle">提取</text><rect x="450" y="124" width="240" height="72" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="570.0" y="155" font-size="19" font-weight="600" fill="#183c34" text-anchor="middle">这一次总结的内容</text><text x="570.0" y="179" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">失败的原因，奏效的做法</text><path d="M 690 160 H 782" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="736" y="150" font-size="15.5" font-weight="600" fill="#183c34" text-anchor="middle">整合</text><rect x="790" y="124" width="220" height="72" rx="10" fill="white" stroke="#183c34" stroke-width="2.4"/><text x="900.0" y="155" font-size="19" font-weight="600" fill="#183c34" text-anchor="middle">经验</text><text x="900.0" y="179" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">写成带条件的做法</text><path d="M 1010 160 H 1088" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="1098" y="154" font-size="15" font-weight="400" fill="#496358" text-anchor="start">以后的</text><text x="1098" y="175" font-size="15" font-weight="400" fill="#496358" text-anchor="start">任务</text><rect x="616" y="242" width="240" height="50" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="736" y="273" font-size="17.5" font-weight="400" fill="#183c34" text-anchor="middle">已有的经验</text><path d="M 736 242 V 170" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="870" y="262" font-size="14" font-weight="400" fill="#496358" text-anchor="start">重复的合并，矛盾的以较新的为准，</text><text x="870" y="283" font-size="14" font-weight="400" fill="#496358" text-anchor="start">不再适用的删掉</text><path d="M 900 124 V 66 H 230 V 116" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="2 7" marker-end="url(#arrow)"/><text x="565" y="56" font-size="15" font-weight="400" fill="#496358" text-anchor="middle">每一条经验注明出自哪一次任务，发现问题时回到记录去核对</text>
</svg>
