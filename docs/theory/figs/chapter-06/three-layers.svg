0" fill="#496358" text-anchor="start">负责把各层接起来</text><rect x="380" y="216" width="360" height="62" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="560.0" y="243" font-size="19" font-weight="600" fill="#183c34" text-anchor="middle">工具</text><text x="560.0" y="265" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">把调用转成指令，计时，送回结果</text><path d="M 500 102 V 208" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="488" y="134" font-size="15" font-weight="400" fill="#496358" text-anchor="end">工具调用</text><path d="M 620 216 V 110" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="632" y="134" font-size="15" font-weight="400" fill="#496358" text-anchor="start">结果</text><rect x="380" y="392" width="360" height="62" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="560.0" y="419" font-size="19" font-weight="600" fill="#183c34" text-anchor="middle">控制程序</text><text x="560.0" y="441" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">算出各个关节怎样运动</text><path d="M 560 278 V 384" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="572" y="340" font-size="15" font-weight="400" fill="#496358" text-anchor="start">目标位置</text><rect x="890" y="296" width="220" height="62" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="1000" y="323" font-size="20" font-weight="600" fill="#183c34" text-anchor="middle">策略</text><text x="1000" y="345" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">训练得到</text><rect x="1070" y="283" width="48" height="26" rx="13" fill="#183c34" stroke="#183c34" stroke-width="1"/><text x="1094.0" y="301" font-size="13.5" font-weight="600" fill="white" text-anchor="middle">权重</text><path d="M 740 247 H 1000 V 288" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="900" y="237" font-size="15" font-weight="400" fill="#496358" text-anchor="middle">文字指令</text><rect x="300" y="538" width="810" height="62" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="705" y="567" font-size="21" font-weight="600" fill="#183c34" text-anchor="middle">本体</text><text x="705" y="589" font-size="14.5" font-weight="400" fill="#496358" text-anchor="middle">自带的控制器、电机、相机</text><rect x="1070" y="525" width="48" height="26" rx="13" fill="#183c34" stroke="#183c34" stroke-width="1"/><text x="1094.0" y="543" font-size="13.5" font-weight="600" fill="white" text-anchor="middle">硬件</text><path d="M 560 454 V 530" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="572" y="514" font-size="15" font-weight="400" fill="#496358" text-anchor="start">关节的目标</text><path d="M 950 358 V 530" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="938" y="452" font-size="15" font-weight="400" fill="#496358" text-anchor="end">动作块</text><path d="M 1050 538 V 366" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="1062" y="452" font-size="15" font-weight="400" fill="#496358" text-anchor="start">图像</text>
</svg>
