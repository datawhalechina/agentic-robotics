<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="632" viewBox="0 0 1200 632" role="img" aria-labelledby="title desc">
<title id="title">机器人智能体的三层</title>
<desc id="desc">从上到下是大模型、Harness 和本体三个部分，画法与图 1.3 相同。三条横向的浅色带子表示三层，名称标在左侧。最上面的大模型是决策层，几秒到几十秒做一次决定，负责安排步骤，失败时决定怎样处理。中间的 Harness 是一个大框，负责把各层接起来。框里上面是工具，它把大模型的调用转成指令，计时，再把结果送回大模型。工具向下有两条路。一条在框里通向控制程序，传递的是目标位置，控制程序算出各个关节怎样运动，再把关节的目标交给本体。另一条通向框外右侧的策略，传递的是文字指令。策略是训练得到的，带有权重，它自己从本体读取图像，把动作块交给本体，每秒输出几十个动作，是策略层。控制程序和本体自带的控制器合起来是控制层，每秒运行几百到上千次，负责让关节准确到达给定的位置。</desc>
<defs>
<marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#496358" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-accent" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#8b6228" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>text{font-family:Arial, Helvetica, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif;}</style>
</defs>
<rect width="1200" height="632" fill="white"/>
<rect x="20" y="20" width="1160" height="592" rx="14" fill="#f6f3e9"/>
