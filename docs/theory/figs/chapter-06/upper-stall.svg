<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="404" viewBox="0 0 1200 404" role="img" aria-labelledby="title desc">
<title id="title">上层停顿时下层的处理</title>
<desc id="desc">从左到右是时间，上下两行分别是上层和下层。上层是大模型，下层是策略或控制程序。开始时上层下达指令 1，下层执行指令 1，画成一条实心的粗线。同时大模型在决定下一条指令，但回答迟了。到了时限，下层没有收到新的指令，便转为保持姿态，这是预先规定的动作，画成一条空心的线。随后迟到的决定到达，一条虚线从上层指向下层，末端打了叉，表示不执行。接着下层重新观测，把观测送给上层，上层下达指令 2，下层执行指令 2。</desc>
<defs>
<marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#496358" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-accent" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#8b6228" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>text{font-family:Arial, Helvetica, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif;}</style>
</defs>
<rect width="1200" height="404" fill="white"/>
<rect x="20" y="20" width="1160" height="364" rx="14" fill="#f6f3e9"/>
<text x="40" y="130" font-size="20" font-weight="600" fill="#183c34" text-anchor="start">上层</text><text x="40" y="153" font-size="14" font-weight="400" fill="#496358" text-anchor="start">大模型</text><text x="40" y="264" font-size="20" font-weight="600" fill="#183c34" text-anchor="start">下层</text><text x="40" y="287" font-size="14" font-weight="400" fill="#496358" text-anchor="start">策略或控制程序</text><rect x="270" y="124" width="520" height="8" rx="4" fill="#94a99a"/><text x="570.0" y="108" font-size="15" font-weight="400" fill="#496358" text-anchor="middle">大模型在决定下一条指令，回答迟了</text><rect x="880" y="124" width="130" height="8" rx="4" fill="#94a99a"/><circle cx="270" cy="128" r="7.5" fill="#f2e7d2" stroke="#8b6228" stroke-width="2"/><text x="270" y="108" font-size="15" font-weight="400" fill="#496358" text-anchor="middle">下达指令 1</text><path d="M 270 138 V 248" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="1010" cy="128" r="7.5" fill="#f2e7d2" stroke="#8b6228" stroke-width="2"/><text x="1010" y="108" font-size="15" font-weight="400" fill="#496358" text-anchor="middle">下达指令 2</text><path d="M 1010 138 V 248" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 790 136 V 218" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="2 7" marker-end="url(#arrow)"/><path d="M 781 225 L 799 243 M 799 225 L 781 243" stroke="#8b6228" stroke-width="2.6" stroke-linecap="round"/><text x="776" y="172" font-size="15" font-weight="400" fill="#496358" text-anchor="end">迟到的决定</text><text x="776" y="194" font-size="15" font-weight="600" fill="#183c34" text-anchor="end">不执行</text><path d="M 880 248 V 138" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="892" y="184" font-size="15" font-weight="400" fill="#496358" text-anchor="start">重新观测</text><rect x="270" y="257" width="290" height="10" rx="5" fill="#183c34"/><text x="415.0" y="292" font-size="16" font-weight="600" fill="#183c34" text-anchor="middle">执行指令 1</text><rect x="560" y="257" width="450" height="10" rx="5" fill="white" stroke="#183c34" stroke-width="1.8"/><text x="785.0" y="292" font-size="16" font-weight="400" fill="#183c34" text-anchor="middle">保持姿态，这是预先规定的动作</text><rect x="1010" y="257" width="130" height="10" rx="5" fill="#183c34"/><text x="1075.0" y="292" font-size="16" font-weight="600" fill="#183c34" text-anchor="middle">执行指令 2</text><path d="M 560 232 V 324" stroke="#8b6228" stroke-width="1.6" stroke-dasharray="4 6"/><text x="560" y="346" font-size="15" font-weight="600" fill="#183c34" text-anchor="middle">时限到，没有收到新的指令</text><path d="M 270 372 H 1148" fill="none" stroke="#94a99a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arrow)"/><text x="1156" y="377" font-size="14.5" font-weight="400" fill="#496358" text-anchor="start">时间</text>
</svg>
