<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="372" viewBox="0 0 1200 372" role="img" aria-labelledby="title desc">
<title id="title">从一种有效的做法到技能库里的技能</title>
<desc id="desc">一条从左到右的流程，主要的路线用粗箭头画出。任务结束以后，先有一种有效的做法，它是执行记录里的一段经过。第一步是整理，把做法写成技能包，里面有说明、代码和清单。第二步是检查，一共四层，依次是格式、依赖、试运行和回归，检查和编写不是同一方。检查通过以后，技能进入技能库，状态分机器人记录。一条虚线从四层检查回到技能包，表示没有通过时退回修改。另一条虚线从四层检查指向技能库，表示检查的结果写成验证记录，和技能一起保存。技能库下方有一个箭头指向已验证，表示一个版本在某台机器人上通过验证以后，在这台机器人上记为已验证，在别的机器人上记为试用，不再使用时改为停用。</desc>
<defs>
<marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#496358" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-accent" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#8b6228" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>text{font-family:Arial, Helvetica, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif;}</style>
</defs>
<rect width="1200" height="372" fill="white"/>
<rect x="20" y="20" width="1160" height="332" rx="14" fill="#f6f3e9"/>
<defs><marker id="arrow-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#183c34" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><circle cx="64" cy="160" r="6.5" fill="#183c34"/><text x="64" y="134" font-size="15" font-weight="400" fill="#496358" text-anchor="middle">任务结束</text><path d="M 74 160 H 102" fill="none" stroke="#183c34" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="110" y="124" width="210" height="72" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="215.0" y="155" font-size="19" font-weight="600" fill="#183c34" text-anchor="middle">有效的做法</text><text x="215.0" y="179" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">执行记录里的一段经过</text><path d="M 320 160 H 392" fill="none" stroke="#183c34" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/><text x="356" y="150" font-size="15.5" font-weight="600" fill="#183c34" text-anchor="middle">整理</text><rect x="400" y="124" width="220" height="72" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="510.0" y="155" font-size="19" font-weight="600" fill="#183c34" text-anchor="middle">技能包</text><text x="510.0" y="179" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">说明，代码，清单</text><path d="M 620 160 H 692" fill="none" stroke="#183c34" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/><text x="656" y="150" font-size="15.5" font-weight="600" fill="#183c34" text-anchor="middle">检查</text><rect x="700" y="124" width="220" height="72" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="810.0" y="155" font-size="19" font-weight="600" fill="#183c34" text-anchor="middle">四层检查</text><text x="810.0" y="179" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">格式，依赖，试运行，回归</text><path d="M 920 160 H 992" fill="none" stroke="#183c34" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/><text x="956" y="150" font-size="15.5" font-weight="600" fill="#183c34" text-anchor="middle">通过</text><rect x="1000" y="124" width="150" height="72" rx="10" fill="white" stroke="#183c34" stroke-width="2.4"/><text x="1075.0" y="155" font-size="19" font-weight="600" fill="#183c34" text-anchor="middle">技能库</text><text x="1075.0" y="179" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">状态分机器人记</text><path d="M 810 196 V 262 H 510 V 204" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="2 7" marker-end="url(#arrow)"/><text x="660" y="286" font-size="15" font-weight="400" fill="#496358" text-anchor="middle">没有通过，退回修改</text><text x="866" y="108" font-size="14" font-weight="400" fill="#496358" text-anchor="end">检查和编写不是同一方</text><path d="M 880 124 V 58 H 1075 V 116" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="2 7" marker-end="url(#arrow)"/><text x="978" y="48" font-size="14.5" font-weight="400" fill="#496358" text-anchor="middle">检查的结果写成验证记录，和技能一起保存</text><path d="M 1075 196 V 262" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="1063" y="238" font-size="14" font-weight="400" fill="#496358" text-anchor="end">在某台机器人上通过验证</text><text x="1075" y="288" font-size="16" font-weight="600" fill="#183c34" text-anchor="middle">在这台机器人上已验证</text><text x="1075" y="312" font-size="13.5" font-weight="400" fill="#607167" text-anchor="middle">别的机器人上记为试用</text><text x="1075" y="334" font-size="13.5" font-weight="400" fill="#607167" text-anchor="middle">不再使用时改为停用</text>
</svg>
