<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="476" viewBox="0 0 1200 476" role="img" aria-labelledby="title desc">
<title id="title">技能包的内容分阶段放进输入</title>
<desc id="desc">上面是大模型，下面是 Harness 的浅色大框，技能库保存在框里。框里并排有三个方框，是技能包的三部分内容，各有一个箭头指向大模型，表示放进它的输入。左边是名称和描述，每条技能约 100 个 token，方框后面叠着几个同样的方框，表示技能库里的每一条技能都有这一部分。它用粗箭头指向输入，表示任务开始时就放进输入。中间是正文，建议不超过 5000 个 token，只取选中的那一条技能，大模型选中这条技能以后才放进输入。右边是代码和参考材料，包括脚本和参考文件，也只取选中的那一条技能。它用虚线箭头指向输入，表示用到时才读取，而且代码只有输出进入输入。</desc>
<defs>
<marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#496358" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-accent" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#8b6228" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>text{font-family:Arial, Helvetica, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif;}</style>
</defs>
<rect width="1200" height="476" fill="white"/>
<rect x="20" y="20" width="1160" height="436" rx="14" fill="#f6f3e9"/>
<defs><marker id="arrow-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#183c34" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="90" y="40" width="1020" height="62" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="600.0" y="79" font-size="21" font-weight="600" fill="#183c34" text-anchor="middle">大模型</text><rect x="1070" y="27" width="48" height="26" rx="13" fill="#183c34" stroke="#183c34" stroke-width="1"/><text x="1094.0" y="45" font-size="13.5" font-weight="600" fill="white" text-anchor="middle">权重</text><rect x="90" y="150" width="1020" height="286" rx="14" fill="#f2e7d2" stroke="#8b6228" stroke-width="1.4"/><text x="116" y="192" font-size="23" font-weight="700" fill="#183c34" text-anchor="start">Harness</text><text x="116" y="218" font-size="14.5" font-weight="400" fill="#496358" text-anchor="start">技能库保存在这里</text><rect x="166" y="292" width="260" height="72" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><rect x="158" y="284" width="260" height="72" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><rect x="150" y="276" width="260" height="72" rx="10" fill="white" stroke="#183c34" stroke-width="2.4"/><text x="280.0" y="307" font-size="20" font-weight="600" fill="#183c34" text-anchor="middle">名称和描述</text><text x="280.0" y="331" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">每条技能约 100 个 token</text><text x="280.0" y="388" font-size="13.5" font-weight="400" fill="#607167" text-anchor="middle">技能库里的每一条技能</text><rect x="470" y="276" width="260" height="72" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="600.0" y="307" font-size="20" font-weight="600" fill="#183c34" text-anchor="middle">正文</text><text x="600.0" y="331" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">建议不超过 5000 个 token</text><text x="600.0" y="388" font-size="13.5" font-weight="400" fill="#607167" text-anchor="middle">选中的那一条技能</text><rect x="790" y="276" width="260" height="72" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="920.0" y="307" font-size="20" font-weight="600" fill="#183c34" text-anchor="middle">代码和参考材料</text><text x="920.0" y="331" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">脚本，参考文件</text><text x="920.0" y="388" font-size="13.5" font-weight="400" fill="#607167" text-anchor="middle">选中的那一条技能</text><path d="M 280 276 V 110" fill="none" stroke="#183c34" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/><text x="294" y="218" font-size="15" font-weight="600" fill="#183c34" text-anchor="start">任务开始时</text><text x="294" y="239" font-size="15" font-weight="600" fill="#183c34" text-anchor="start">就放进输入</text><path d="M 600 276 V 110" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="614" y="218" font-size="15" font-weight="400" fill="#496358" text-anchor="start">大模型选中这条技能</text><text x="614" y="239" font-size="15" font-weight="400" fill="#496358" text-anchor="start">以后放进输入</text><path d="M 920 276 V 110" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="2 7" marker-end="url(#arrow)"/><text x="934" y="218" font-size="15" font-weight="400" fill="#496358" text-anchor="start">用到时才读取，</text><text x="934" y="239" font-size="15" font-weight="400" fill="#496358" text-anchor="start">代码只有输出进入输入</text>
</svg>
