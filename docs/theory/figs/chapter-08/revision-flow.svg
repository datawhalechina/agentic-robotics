<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="388" viewBox="0 0 1200 388" role="img" aria-labelledby="title desc">
<title id="title">一次修订从失败到保留或者放弃的经过</title>
<desc id="desc">一条从左到右的流程，主要的路线用粗箭头画出。起点是一次失败。第一步从执行记录里找出失败的原因。第二步是整理，得到测试和假设，原来的版本不能通过这条测试。第三步是修改，得到候选版本，改动的范围尽量小。第四步是比较，候选版本和原来的版本在三组任务上比较：原来失败的任务，原来能完成的任务，留出的任务。比较的结果符合规则，就启用新版本，分步启用并继续观察。一条虚线从比较回到测试和假设，表示不符合规则时放弃这个候选版本。另一条虚线从启用新版本回到执行记录，表示出了问题时回滚到原来的版本，再从记录里找原因。图的上方写着两条对整个过程都成立的要求：评估、任务的定义和安全检查不在修订的范围之内；检查的一方和提出修订的一方分开，原来的版本一直留存。</desc>
<defs>
<marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#496358" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-accent" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#8b6228" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>text{font-family:Arial, Helvetica, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif;}</style>
</defs>
<rect width="1200" height="388" fill="white"/>
<rect x="20" y="20" width="1160" height="348" rx="14" fill="#f6f3e9"/>
<defs><marker id="arrow-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#183c34" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><circle cx="60" cy="168" r="6.5" fill="#183c34"/><text x="60" y="142" font-size="15" font-weight="400" fill="#496358" text-anchor="middle">一次失败</text><path d="M 70 168 H 98" fill="none" stroke="#183c34" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/><rect x="106" y="132" width="190" height="72" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="201.0" y="163" font-size="19" font-weight="600" fill="#183c34" text-anchor="middle">执行记录</text><text x="201.0" y="187" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">找出失败的原因</text><path d="M 296 168 H 356" fill="none" stroke="#183c34" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/><text x="326" y="158" font-size="15.5" font-weight="600" fill="#183c34" text-anchor="middle">整理</text><rect x="364" y="132" width="210" height="72" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="469.0" y="163" font-size="19" font-weight="600" fill="#183c34" text-anchor="middle">测试和假设</text><text x="469.0" y="187" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">原来的版本不能通过这条测试</text><path d="M 574 168 H 634" fill="none" stroke="#183c34" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/><text x="604" y="158" font-size="15.5" font-weight="600" fill="#183c34" text-anchor="middle">修改</text><rect x="642" y="132" width="170" height="72" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="727.0" y="163" font-size="19" font-weight="600" fill="#183c34" text-anchor="middle">候选版本</text><text x="727.0" y="187" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">改动的范围尽量小</text><path d="M 812 168 H 872" fill="none" stroke="#183c34" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/><text x="842" y="158" font-size="15.5" font-weight="600" fill="#183c34" text-anchor="middle">比较</text><rect x="880" y="132" width="270" height="72" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="1015.0" y="163" font-size="19" font-weight="600" fill="#183c34" text-anchor="middle">和原来的版本比较</text><text x="1015.0" y="187" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">原来失败的，原来能完成的，留出的</text><path d="M 1090 204 V 268" fill="none" stroke="#183c34" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/><text x="1102" y="244" font-size="15.5" font-weight="600" fill="#183c34" text-anchor="start">符合规则</text><rect x="940" y="276" width="210" height="72" rx="10" fill="white" stroke="#183c34" stroke-width="2.4"/><text x="1045.0" y="307" font-size="19" font-weight="600" fill="#183c34" text-anchor="middle">启用新版本</text><text x="1045.0" y="331" font-size="14" font-weight="400" fill="#496358" text-anchor="middle">分步启用，继续观察</text><path d="M 960 204 V 232 H 469 V 212" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="2 7" marker-end="url(#arrow)"/><text x="714" y="256" font-size="15" font-weight="400" fill="#496358" text-anchor="middle">不符合规则，放弃这个候选版本</text><path d="M 940 312 H 201 V 212" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="2 7" marker-end="url(#arrow)"/><text x="570" y="336" font-size="15" font-weight="400" fill="#496358" text-anchor="middle">出了问题，回滚到原来的版本，再从记录里找原因</text><text x="642" y="58" font-size="15" font-weight="400" fill="#496358" text-anchor="middle">评估、任务的定义和安全检查不在修订的范围之内</text><text x="642" y="84" font-size="15" font-weight="400" fill="#496358" text-anchor="middle">检查的一方和提出修订的一方分开，原来的版本一直留存</text>
</svg>
