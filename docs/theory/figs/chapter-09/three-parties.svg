<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">评估时执行者、评分器和参考真值的关系</title>
<desc id="desc">图的中间是任务环境，里面是物体和机器人的实际状态。左边是执行者，也就是机器人智能体，它和任务环境之间有两个箭头：通过工具发出动作，通过工具取得观测。右边用虚线框出评分器一侧，里面有参考真值和评分器。参考真值包括环境的真实状态和任务的标准答案。评分器可以是程序、模型或者人，它对照参考真值来判定。一个箭头从任务环境指向评分器，标着评分器自己取得的状态。评分器向下给出结果，结果有成功、失败和未知三种。另有两条打了叉的虚线，表示不允许的途径：一条从执行者指向参考真值，标着执行者读不到参考真值，也不能改动评分器；另一条从执行者指向评分器，标着执行者的报告、发布的状态和写下的文件不作为判定的依据。</desc>
<defs>
<marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#496358" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-accent" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#8b6228" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>text{font-family:Arial, Helvetica, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif;}</style>
</defs>
<rect width="1200" height="430" fill="white"/>
<rect x="20" y="20" width="1160" height="390" rx="14" fill="#f6f3e9"/>
<rect x="60" y="150" width="250" height="150" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="185.0" y="221.0" font-size="20" font-weight="600" fill="#183c34" text-anchor="middle">执行者</text><text x="185.0" y="247.0" font-size="14.5" font-weight="400" fill="#496358" text-anchor="middle">机器人智能体</text><rect x="450" y="150" width="250" height="150" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="575.0" y="221.0" font-size="20" font-weight="600" fill="#183c34" text-anchor="middle">任务环境</text><text x="575.0" y="247.0" font-size="14.5" font-weight="400" fill="#496358" text-anchor="middle">物体和机器人的实际状态</text><rect x="850" y="112" width="300" height="226" rx="12" fill="none" stroke="#94a99a" stroke-width="1.4" stroke-dasharray="6 6"/><text x="866" y="134" font-size="14.5" font-weight="400" fill="#496358" text-anchor="start">评分器一侧</text><rect x="880" y="146" width="240" height="70" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="1000.0" y="177.0" font-size="20" font-weight="600" fill="#183c34" text-anchor="middle">参考真值</text><text x="1000.0" y="203.0" font-size="14.5" font-weight="400" fill="#496358" text-anchor="middle">真实状态和标准答案</text><rect x="880" y="252" width="240" height="70" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="1000.0" y="283.0" font-size="20" font-weight="600" fill="#183c34" text-anchor="middle">评分器</text><text x="1000.0" y="309.0" font-size="14.5" font-weight="400" fill="#496358" text-anchor="middle">程序、模型或者人</text><path d="M 310 190 H 442" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="376" y="180" font-size="14.5" font-weight="400" fill="#183c34" text-anchor="middle">通过工具发出动作</text><path d="M 450 262 H 318" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="376" y="252" font-size="14.5" font-weight="400" fill="#183c34" text-anchor="middle">通过工具取得观测</text><path d="M 700 287 H 872" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="786" y="277" font-size="14.5" font-weight="400" fill="#183c34" text-anchor="middle">评分器自己取得的状态</text><path d="M 1000 216 V 244" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="1012" y="236" font-size="14.5" font-weight="400" fill="#183c34" text-anchor="start">对照</text><path d="M 1060 322 V 372" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="1060" y="398" font-size="15.5" font-weight="600" fill="#183c34" text-anchor="middle">结果：成功、失败或者未知</text><path d="M 185 150 V 66 H 1000 V 138" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="2 7" marker-end="url(#arrow)"/><circle cx="592" cy="66" r="12" fill="white" stroke="#496358" stroke-width="1.4"/><path d="M 587 61 L 597 71 M 597 61 L 587 71" stroke="#183c34" stroke-width="2.2" stroke-linecap="round"/><text x="592" y="42" font-size="15" font-weight="400" fill="#496358" text-anchor="middle">执行者读不到参考真值，也不能改动评分器</text><path d="M 185 300 V 372 H 940 V 330" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="2 7" marker-end="url(#arrow)"/><circle cx="562" cy="372" r="12" fill="white" stroke="#496358" stroke-width="1.4"/><path d="M 557 367 L 567 377 M 567 367 L 557 377" stroke="#183c34" stroke-width="2.2" stroke-linecap="round"/><text x="562" y="404" font-size="15" font-weight="400" fill="#496358" text-anchor="middle">执行者的报告、发布的状态和写下的文件，不作为判定的依据</text>
</svg>
