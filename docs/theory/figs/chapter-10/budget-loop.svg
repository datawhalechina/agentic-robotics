<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">固定预算的训练循环</title>
<desc id="desc">图分成三个部分。左边是智能体可以修改的内容：奖励、训练的配置和训练的代码。中间是一个循环，共四步，用粗箭头连接：提出一处改动，得到一个候选；按固定的预算训练一次；在验证的回合上评估；指标变好才保留，否则退回。循环下方是实验记录，每次运行一条，没有保留的也在内，由 Harness 写入。右边是固定不动、智能体接触不到的内容：单次运行的预算，成功判据和评分器，以及三组回合。开发的回合智能体可以随意使用，验证的回合只把成绩告诉智能体，测试的回合只在最后用一次，报告的成绩出自这一组。图的底部写着：循环结束以后，选出的候选在测试的回合上评估一次。</desc>
<defs>
<marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#496358" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-accent" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#8b6228" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>text{font-family:Arial, Helvetica, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif;}</style>
</defs>
<rect width="1200" height="470" fill="white"/>
<rect x="20" y="20" width="1160" height="430" rx="14" fill="#f6f3e9"/>
<defs><marker id="arrow-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#183c34" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="40" y="60" width="220" height="250" rx="12" fill="none" stroke="#94a99a" stroke-width="1.4" stroke-dasharray="6 6"/><text x="56" y="86" font-size="15" font-weight="400" fill="#496358" text-anchor="start">智能体可以修改的</text><rect x="64" y="104" width="172" height="36" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="150.0" y="128" font-size="15.5" font-weight="600" fill="#183c34" text-anchor="middle">奖励</text><rect x="64" y="166" width="172" height="36" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="150.0" y="190" font-size="15.5" font-weight="600" fill="#183c34" text-anchor="middle">训练的配置</text><rect x="64" y="228" width="172" height="36" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="150.0" y="252" font-size="15.5" font-weight="600" fill="#183c34" text-anchor="middle">训练的代码</text><rect x="330" y="70" width="250" height="66" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="455.0" y="99" font-size="18" font-weight="600" fill="#183c34" text-anchor="middle">提出一处改动</text><text x="455.0" y="121" font-size="13.5" font-weight="400" fill="#496358" text-anchor="middle">得到一个候选</text><rect x="330" y="244" width="250" height="66" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="455.0" y="273" font-size="18" font-weight="600" fill="#183c34" text-anchor="middle">训练一次</text><text x="455.0" y="295" font-size="13.5" font-weight="400" fill="#496358" text-anchor="middle">预算固定</text><rect x="640" y="244" width="250" height="66" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="765.0" y="273" font-size="18" font-weight="600" fill="#183c34" text-anchor="middle">评估</text><text x="765.0" y="295" font-size="13.5" font-weight="400" fill="#496358" text-anchor="middle">在验证的回合上</text><rect x="640" y="70" width="250" height="66" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="765.0" y="99" font-size="18" font-weight="600" fill="#183c34" text-anchor="middle">保留或者退回</text><text x="765.0" y="121" font-size="13.5" font-weight="400" fill="#496358" text-anchor="middle">指标变好才保留</text><path d="M 455 136 V 236" fill="none" stroke="#183c34" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/><path d="M 580 277 H 632" fill="none" stroke="#183c34" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/><path d="M 765 244 V 144" fill="none" stroke="#183c34" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/><path d="M 640 103 H 588" fill="none" stroke="#183c34" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/><path d="M 260 103 H 322" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="291" y="93" font-size="14" font-weight="400" fill="#183c34" text-anchor="middle">改动</text><rect x="330" y="366" width="560" height="52" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="610" y="388" font-size="17" font-weight="600" fill="#183c34" text-anchor="middle">实验记录</text><text x="610" y="408" font-size="13.5" font-weight="400" fill="#496358" text-anchor="middle">每次运行一条，没有保留的也在内，由 Harness 写入</text><path d="M 455 310 V 358" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="2 7" marker-end="url(#arrow)"/><path d="M 765 310 V 358" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="2 7" marker-end="url(#arrow)"/><rect x="940" y="60" width="220" height="358" rx="12" fill="none" stroke="#94a99a" stroke-width="1.4" stroke-dasharray="6 6"/><text x="956" y="86" font-size="15" font-weight="400" fill="#496358" text-anchor="start">固定不动、智能体接触不到的</text><rect x="960" y="100" width="180" height="36" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="1050.0" y="124" font-size="15.5" font-weight="600" fill="#183c34" text-anchor="middle">单次运行的预算</text><rect x="960" y="146" width="180" height="36" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="1050.0" y="170" font-size="15.5" font-weight="600" fill="#183c34" text-anchor="middle">成功判据和评分器</text><rect x="960" y="204" width="180" height="46" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="1050.0" y="224" font-size="15.5" font-weight="600" fill="#183c34" text-anchor="middle">开发的回合</text><text x="1050.0" y="242" font-size="12.5" font-weight="400" fill="#496358" text-anchor="middle">智能体随意使用</text><rect x="960" y="260" width="180" height="46" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="1050.0" y="280" font-size="15.5" font-weight="600" fill="#183c34" text-anchor="middle">验证的回合</text><text x="1050.0" y="298" font-size="12.5" font-weight="400" fill="#496358" text-anchor="middle">只把成绩告诉智能体</text><rect x="960" y="316" width="180" height="46" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="1050.0" y="336" font-size="15.5" font-weight="600" fill="#183c34" text-anchor="middle">测试的回合</text><text x="1050.0" y="354" font-size="12.5" font-weight="400" fill="#496358" text-anchor="middle">最后用一次，成绩由此报告</text><path d="M 960 283 H 898" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="929" y="273" font-size="14" font-weight="400" fill="#183c34" text-anchor="middle">成绩</text><text x="610" y="446" font-size="14.5" font-weight="400" fill="#496358" text-anchor="middle">循环结束以后，选出的候选在测试的回合上评估一次</text>
</svg>
