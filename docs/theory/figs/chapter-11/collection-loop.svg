<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">智能体采集数据的循环</title>
<desc id="desc">图分成三个部分。左边是由人预先定好、智能体不能改动的内容：任务表和布局清单，成功判据和评分器，安全限制，重试的上限。中间是一个循环，共四步，用粗箭头连接：安排任务，从任务表和布局清单里选；执行并监视，动作由程序、策略或者人来做；判定成功，由评分器判定；复位，恢复到下一个回合可以开始的状态。循环下方是执行记录，每个回合一份，成功和失败的都保留。右边是人介入的两处：重试用完时接手处理，抽样标注一批回合来核对评分器。图的底部写着：留给评估用的布局不参加采集。</desc>
<defs>
<marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#496358" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-accent" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#8b6228" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>text{font-family:Arial, Helvetica, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif;}</style>
</defs>
<rect width="1200" height="470" fill="white"/>
<rect x="20" y="20" width="1160" height="430" rx="14" fill="#f6f3e9"/>
<defs><marker id="arrow-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#183c34" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="40" y="60" width="230" height="296" rx="12" fill="none" stroke="#94a99a" stroke-width="1.4" stroke-dasharray="6 6"/><text x="56" y="86" font-size="15" font-weight="400" fill="#496358" text-anchor="start">由人预先定好、智能体不能改的</text><rect x="60" y="104" width="190" height="36" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="155.0" y="128" font-size="15.5" font-weight="600" fill="#183c34" text-anchor="middle">任务表和布局清单</text><rect x="60" y="164" width="190" height="36" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="155.0" y="188" font-size="15.5" font-weight="600" fill="#183c34" text-anchor="middle">成功判据和评分器</text><rect x="60" y="224" width="190" height="36" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="155.0" y="248" font-size="15.5" font-weight="600" fill="#183c34" text-anchor="middle">安全限制</text><rect x="60" y="284" width="190" height="36" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="155.0" y="308" font-size="15.5" font-weight="600" fill="#183c34" text-anchor="middle">重试的上限</text><rect x="330" y="70" width="250" height="66" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="455.0" y="99" font-size="18" font-weight="600" fill="#183c34" text-anchor="middle">安排任务</text><text x="455.0" y="121" font-size="13.5" font-weight="400" fill="#496358" text-anchor="middle">从任务表和布局清单里选</text><rect x="330" y="244" width="250" height="66" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="455.0" y="273" font-size="18" font-weight="600" fill="#183c34" text-anchor="middle">执行并监视</text><text x="455.0" y="295" font-size="13.5" font-weight="400" fill="#496358" text-anchor="middle">动作由程序、策略或者人来做</text><rect x="640" y="244" width="250" height="66" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="765.0" y="273" font-size="18" font-weight="600" fill="#183c34" text-anchor="middle">判定成功</text><text x="765.0" y="295" font-size="13.5" font-weight="400" fill="#496358" text-anchor="middle">由评分器判定</text><rect x="640" y="70" width="250" height="66" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="765.0" y="99" font-size="18" font-weight="600" fill="#183c34" text-anchor="middle">复位</text><text x="765.0" y="121" font-size="13.5" font-weight="400" fill="#496358" text-anchor="middle">恢复到可以开始的状态</text><path d="M 455 136 V 236" fill="none" stroke="#183c34" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/><path d="M 580 277 H 632" fill="none" stroke="#183c34" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/><path d="M 765 244 V 144" fill="none" stroke="#183c34" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/><path d="M 640 103 H 588" fill="none" stroke="#183c34" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/><path d="M 270 103 H 322" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="296" y="93" font-size="14" font-weight="400" fill="#183c34" text-anchor="middle">限定</text><rect x="330" y="366" width="560" height="52" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="610" y="388" font-size="17" font-weight="600" fill="#183c34" text-anchor="middle">执行记录</text><text x="610" y="408" font-size="13.5" font-weight="400" fill="#496358" text-anchor="middle">每个回合一份，成功和失败的都保留</text><path d="M 455 310 V 358" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="2 7" marker-end="url(#arrow)"/><path d="M 765 310 V 358" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="2 7" marker-end="url(#arrow)"/><rect x="940" y="60" width="220" height="296" rx="12" fill="none" stroke="#94a99a" stroke-width="1.4" stroke-dasharray="6 6"/><text x="956" y="86" font-size="15" font-weight="400" fill="#496358" text-anchor="start">人介入的环节</text><rect x="960" y="104" width="180" height="46" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="1050.0" y="124" font-size="15.5" font-weight="600" fill="#183c34" text-anchor="middle">重试用完时接手</text><text x="1050.0" y="142" font-size="12.5" font-weight="400" fill="#496358" text-anchor="middle">智能体停下来通知人</text><rect x="960" y="254" width="180" height="46" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="1050.0" y="274" font-size="15.5" font-weight="600" fill="#183c34" text-anchor="middle">抽样标注</text><text x="1050.0" y="292" font-size="12.5" font-weight="400" fill="#496358" text-anchor="middle">核对评分器是否准确</text><path d="M 890 127 H 952" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="921" y="117" font-size="14" font-weight="400" fill="#183c34" text-anchor="middle">求助</text><path d="M 960 277 H 898" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="929" y="267" font-size="14" font-weight="400" fill="#183c34" text-anchor="middle">核对</text><text x="610" y="446" font-size="14.5" font-weight="400" fill="#496358" text-anchor="middle">留给评估用的布局不参加采集</text>
</svg>
