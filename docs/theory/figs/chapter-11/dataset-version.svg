<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">从原始记录到一个数据集版本</title>
<desc id="desc">一条从左到右的流程，主要的路线用粗箭头画出。起点是原始记录，也就是执行记录，不作改动。第一步是标注，标出成功与否、失败的原因和恢复的片段。第二步是检查，分四个层次。第三步是划分，按起始布局划分。终点是一个数据集版本，带着数据集说明和清单。标注、检查和划分上方各有一条虚线指向处理记录，每一步记下命令、输入、参数和输出。一条虚线从检查指向左下方另外存放的回合，包括不收的和失败的，都标明原因。数据集版本下方是下游的检验，用这份数据训练一个模型并评估。一条虚线从下游的检验回到检查，表示发现问题以后回头检查。</desc>
<defs>
<marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#496358" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-accent" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#8b6228" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>text{font-family:Arial, Helvetica, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif;}</style>
</defs>
<rect width="1200" height="400" fill="white"/>
<rect x="20" y="20" width="1160" height="360" rx="14" fill="#f6f3e9"/>
<defs><marker id="arrow-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#183c34" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="270" y="44" width="640" height="52" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="590" y="66" font-size="17" font-weight="600" fill="#183c34" text-anchor="middle">处理记录</text><text x="590" y="86" font-size="13.5" font-weight="400" fill="#496358" text-anchor="middle">每一步记下命令、输入、参数和输出</text><rect x="40" y="160" width="180" height="66" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="130.0" y="189" font-size="18" font-weight="600" fill="#183c34" text-anchor="middle">原始记录</text><text x="130.0" y="211" font-size="13.5" font-weight="400" fill="#496358" text-anchor="middle">执行记录，不作改动</text><rect x="270" y="160" width="180" height="66" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="360.0" y="189" font-size="18" font-weight="600" fill="#183c34" text-anchor="middle">标注</text><text x="360.0" y="211" font-size="13.5" font-weight="400" fill="#496358" text-anchor="middle">成功与否、原因、恢复</text><rect x="500" y="160" width="180" height="66" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="590.0" y="189" font-size="18" font-weight="600" fill="#183c34" text-anchor="middle">检查</text><text x="590.0" y="211" font-size="13.5" font-weight="400" fill="#496358" text-anchor="middle">四个层次</text><rect x="730" y="160" width="180" height="66" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="820.0" y="189" font-size="18" font-weight="600" fill="#183c34" text-anchor="middle">划分</text><text x="820.0" y="211" font-size="13.5" font-weight="400" fill="#496358" text-anchor="middle">按起始布局</text><rect x="960" y="160" width="200" height="66" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="1060.0" y="189" font-size="18" font-weight="600" fill="#183c34" text-anchor="middle">数据集版本</text><text x="1060.0" y="211" font-size="13.5" font-weight="400" fill="#496358" text-anchor="middle">数据集说明和清单</text><path d="M 220 193 H 262" fill="none" stroke="#183c34" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/><path d="M 450 193 H 492" fill="none" stroke="#183c34" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/><path d="M 680 193 H 722" fill="none" stroke="#183c34" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/><path d="M 910 193 H 952" fill="none" stroke="#183c34" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/><path d="M 360 160 V 104" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="2 7" marker-end="url(#arrow)"/><path d="M 590 160 V 104" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="2 7" marker-end="url(#arrow)"/><path d="M 820 160 V 104" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="2 7" marker-end="url(#arrow)"/><rect x="40" y="300" width="220" height="66" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="150.0" y="329" font-size="18" font-weight="600" fill="#183c34" text-anchor="middle">另外存放的回合</text><text x="150.0" y="351" font-size="13.5" font-weight="400" fill="#496358" text-anchor="middle">不收的和失败的，标明原因</text><path d="M 540 226 V 333 H 268" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="2 7" marker-end="url(#arrow)"/><rect x="960" y="300" width="200" height="66" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="1060.0" y="329" font-size="18" font-weight="600" fill="#183c34" text-anchor="middle">下游的检验</text><text x="1060.0" y="351" font-size="13.5" font-weight="400" fill="#496358" text-anchor="middle">训练一个模型并评估</text><path d="M 1060 226 V 292" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 960 333 H 640 V 234" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="2 7" marker-end="url(#arrow)"/><text x="800" y="323" font-size="14" font-weight="400" fill="#183c34" text-anchor="middle">发现问题，回头检查</text>
</svg>
