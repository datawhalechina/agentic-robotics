<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">同一只碗的显示形状和碰撞形状</title>
<desc id="desc">同一只碗的三幅侧面图，每幅里有一块红色积木。左边一幅是显示用的形状：碗是中空的，画面上积木可以放在碗里。中间一幅是不作处理时碰撞用的形状：仿真软件取碗的凸包，碗口被填平，成了实心的一块，积木只能搁在上面，原来的碗用虚线画出。右边一幅是分解以后碰撞用的形状：碗壁和碗底分成三个凸的部分，积木可以放进碗里。</desc>
<defs>
<marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#496358" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-accent" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#8b6228" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>text{font-family:Arial, Helvetica, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif;}</style>
</defs>
<rect width="1200" height="330" fill="white"/>
<rect x="20" y="20" width="1160" height="290" rx="14" fill="#f6f3e9"/>
<text x="210" y="70" font-size="18" font-weight="600" fill="#183c34" text-anchor="middle">显示用的形状</text><line x1="60" y1="236" x2="360" y2="236" stroke="#94a99a" stroke-width="2" stroke-linecap="round"/><polygon points="106,152 154,236 266,236 314,152 300,152 258,222 162,222 120,152" fill="#f2e7d2" stroke="#8b6228" stroke-width="1.8" stroke-linejoin="round"/><rect x="193.0" y="188" width="34" height="34" rx="3" fill="#d65442" stroke="#183c34" stroke-width="1.2"/><text x="210" y="280" font-size="14.5" font-weight="400" fill="#496358" text-anchor="middle">画面上积木可以放在碗里</text><text x="600" y="70" font-size="18" font-weight="600" fill="#183c34" text-anchor="middle">碰撞用的形状，不作处理</text><line x1="450" y1="236" x2="750" y2="236" stroke="#94a99a" stroke-width="2" stroke-linecap="round"/><polygon points="496,152 544,236 656,236 704,152" fill="#edf0e6" stroke="#183c34" stroke-width="1.8" stroke-linejoin="round"/><polygon points="496,152 544,236 656,236 704,152 690,152 648,222 552,222 510,152" fill="none" stroke="#8b6228" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="5 5"/><rect x="583.0" y="118" width="34" height="34" rx="3" fill="#d65442" stroke="#183c34" stroke-width="1.2"/><text x="600" y="280" font-size="14.5" font-weight="400" fill="#496358" text-anchor="middle">取凸包，成了实心的一块</text><text x="990" y="70" font-size="18" font-weight="600" fill="#183c34" text-anchor="middle">碰撞用的形状，分解以后</text><line x1="840" y1="236" x2="1140" y2="236" stroke="#94a99a" stroke-width="2" stroke-linecap="round"/><polygon points="886,152 934,236 942,222 900,152" fill="#edf0e6" stroke="#183c34" stroke-width="1.8" stroke-linejoin="round"/><polygon points="934,236 1046,236 1038,222 942,222" fill="#edf0e6" stroke="#183c34" stroke-width="1.8" stroke-linejoin="round"/><polygon points="1094,152 1046,236 1038,222 1080,152" fill="#edf0e6" stroke="#183c34" stroke-width="1.8" stroke-linejoin="round"/><rect x="973.0" y="188" width="34" height="34" rx="3" fill="#d65442" stroke="#183c34" stroke-width="1.2"/><text x="990" y="280" font-size="14.5" font-weight="400" fill="#496358" text-anchor="middle">分成三个凸的部分，积木放得进去</text>
</svg>
