<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
<title id="title">生成的布局和任务从配置到清单的经过</title>
<desc id="desc">一条从左到右的流程，主要的路线用粗箭头画出。起点是填写任务配置，由智能体填写，判据由人写或者核对。第二步是抽取布局，由程序按配置里的规则抽取。第三步是自动检查，逐项进行，不通过就筛掉。第四步是人核对，对照指令读判据，抽看几种布局。终点是任务表和布局清单，登记时带着版本和种子。一条虚线从自动检查回到填写任务配置，表示把筛掉的原因反馈回去修改，修改的轮数有上限。自动检查下方是筛掉的布局，逐项计数并记下原因。左下方是智能体自由编写的场景代码，一条虚线把它接到自动检查，表示它同样要经过这些检查。</desc>
<defs>
<marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#496358" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-accent" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#8b6228" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>text{font-family:Arial, Helvetica, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif;}</style>
</defs>
<rect width="1200" height="400" fill="white"/>
<rect x="20" y="20" width="1160" height="360" rx="14" fill="#f6f3e9"/>
<defs><marker id="arrow-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#183c34" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="44" y="128" font-size="14" font-weight="400" fill="#496358" text-anchor="start">起点</text><rect x="40" y="140" width="200" height="66" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="140.0" y="169" font-size="18" font-weight="600" fill="#183c34" text-anchor="middle">填写任务配置</text><text x="140.0" y="191" font-size="13.5" font-weight="400" fill="#496358" text-anchor="middle">智能体填写，判据由人把关</text><rect x="280" y="140" width="190" height="66" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="375.0" y="169" font-size="18" font-weight="600" fill="#183c34" text-anchor="middle">抽取布局</text><text x="375.0" y="191" font-size="13.5" font-weight="400" fill="#496358" text-anchor="middle">程序按配置里的规则</text><rect x="510" y="140" width="190" height="66" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="605.0" y="169" font-size="18" font-weight="600" fill="#183c34" text-anchor="middle">自动检查</text><text x="605.0" y="191" font-size="13.5" font-weight="400" fill="#496358" text-anchor="middle">逐项进行，见表 12.3</text><rect x="740" y="140" width="190" height="66" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="835.0" y="169" font-size="18" font-weight="600" fill="#183c34" text-anchor="middle">人核对</text><text x="835.0" y="191" font-size="13.5" font-weight="400" fill="#496358" text-anchor="middle">对照指令读判据，抽看布局</text><rect x="970" y="140" width="190" height="66" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="1065.0" y="169" font-size="18" font-weight="600" fill="#183c34" text-anchor="middle">任务表和布局清单</text><text x="1065.0" y="191" font-size="13.5" font-weight="400" fill="#496358" text-anchor="middle">带着版本和种子</text><path d="M 240 173 H 272" fill="none" stroke="#183c34" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/><path d="M 470 173 H 502" fill="none" stroke="#183c34" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/><path d="M 700 173 H 732" fill="none" stroke="#183c34" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/><path d="M 930 173 H 962" fill="none" stroke="#183c34" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/><path d="M 605 140 V 84 H 180 V 132" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="2 7" marker-end="url(#arrow)"/><text x="392" y="74" font-size="14" font-weight="400" fill="#183c34" text-anchor="middle">筛掉的原因反馈回去修改，轮数有上限</text><rect x="510" y="290" width="190" height="66" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="605.0" y="319" font-size="18" font-weight="600" fill="#183c34" text-anchor="middle">筛掉的布局</text><text x="605.0" y="341" font-size="13.5" font-weight="400" fill="#496358" text-anchor="middle">逐项计数，记下原因</text><path d="M 650 206 V 282" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="40" y="290" width="300" height="66" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="190.0" y="319" font-size="18" font-weight="600" fill="#183c34" text-anchor="middle">智能体自由编写的场景代码</text><text x="190.0" y="341" font-size="13.5" font-weight="400" fill="#496358" text-anchor="middle">配置表达不了的情况</text><path d="M 340 323 H 470 V 246 H 555 V 214" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="2 7" marker-end="url(#arrow)"/><text x="405" y="313" font-size="14" font-weight="400" fill="#183c34" text-anchor="middle">同样要经过检查</text>
</svg>
