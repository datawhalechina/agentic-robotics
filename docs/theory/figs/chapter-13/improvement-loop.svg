<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">智能体改进机器人的循环</title>
<desc id="desc">图分成三个部分。左边是由人预先定好、循环不能改动的内容：目标和任务表，评估以及验证和测试的回合，改动计划和保留的规则，安全限制和预算。中间是一个循环，共六步，用粗箭头按顺时针方向连接：执行，留下执行记录；诊断，从记录判断失败的原因；选择对象，五类里选一类；提出候选版本，一次只改一处；验证，用验证的一组回合；保留或者回滚，按事先定好的规则。然后回到执行。循环下方是改进记录，每一轮一份，没有保留的也记。右边是交回给人的三种情况：原因出在评估上，改动在计划之外，轮数用完仍然没有改进。</desc>
<defs>
<marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#496358" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-accent" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#8b6228" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>text{font-family:Arial, Helvetica, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif;}</style>
</defs>
<rect width="1200" height="480" fill="white"/>
<rect x="20" y="20" width="1160" height="440" rx="14" fill="#f6f3e9"/>
<defs><marker id="arrow-ink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#183c34" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="40" y="60" width="230" height="296" rx="12" fill="none" stroke="#94a99a" stroke-width="1.4" stroke-dasharray="6 6"/><text x="56" y="86" font-size="15" font-weight="400" fill="#496358" text-anchor="start">由人预先定好、循环不能改的</text><rect x="60" y="104" width="190" height="36" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="155.0" y="128" font-size="15.5" font-weight="600" fill="#183c34" text-anchor="middle">目标和任务表</text><rect x="60" y="164" width="190" height="36" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="155.0" y="188" font-size="15.5" font-weight="600" fill="#183c34" text-anchor="middle">评估，验证和测试的回合</text><rect x="60" y="224" width="190" height="36" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="155.0" y="248" font-size="15.5" font-weight="600" fill="#183c34" text-anchor="middle">改动计划和保留的规则</text><rect x="60" y="284" width="190" height="36" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="155.0" y="308" font-size="15.5" font-weight="600" fill="#183c34" text-anchor="middle">安全限制和预算</text><rect x="316" y="70" width="176" height="66" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="404.0" y="99" font-size="18" font-weight="600" fill="#183c34" text-anchor="middle">执行</text><text x="404.0" y="121" font-size="13.5" font-weight="400" fill="#496358" text-anchor="middle">留下执行记录</text><rect x="512" y="70" width="176" height="66" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="600.0" y="99" font-size="18" font-weight="600" fill="#183c34" text-anchor="middle">诊断</text><text x="600.0" y="121" font-size="13.5" font-weight="400" fill="#496358" text-anchor="middle">从记录判断失败的原因</text><rect x="708" y="70" width="176" height="66" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="796.0" y="99" font-size="18" font-weight="600" fill="#183c34" text-anchor="middle">选择对象</text><text x="796.0" y="121" font-size="13.5" font-weight="400" fill="#496358" text-anchor="middle">五类里选一类，见表 13.1</text><rect x="708" y="244" width="176" height="66" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="796.0" y="273" font-size="18" font-weight="600" fill="#183c34" text-anchor="middle">提出候选版本</text><text x="796.0" y="295" font-size="13.5" font-weight="400" fill="#496358" text-anchor="middle">一次只改一处</text><rect x="512" y="244" width="176" height="66" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="600.0" y="273" font-size="18" font-weight="600" fill="#183c34" text-anchor="middle">验证</text><text x="600.0" y="295" font-size="13.5" font-weight="400" fill="#496358" text-anchor="middle">用验证的一组回合</text><rect x="316" y="244" width="176" height="66" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="404.0" y="273" font-size="18" font-weight="600" fill="#183c34" text-anchor="middle">保留或者回滚</text><text x="404.0" y="295" font-size="13.5" font-weight="400" fill="#496358" text-anchor="middle">按事先定好的规则</text><path d="M 492 103 H 504" fill="none" stroke="#183c34" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/><path d="M 688 103 H 700" fill="none" stroke="#183c34" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/><path d="M 796.0 136 V 236" fill="none" stroke="#183c34" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/><path d="M 708 277 H 696" fill="none" stroke="#183c34" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/><path d="M 512 277 H 500" fill="none" stroke="#183c34" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/><path d="M 404.0 244 V 144" fill="none" stroke="#183c34" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-ink)"/><path d="M 270 103 H 308" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="289" y="93" font-size="14" font-weight="400" fill="#183c34" text-anchor="middle">限定</text><rect x="316" y="366" width="568" height="52" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="600.0" y="388" font-size="17" font-weight="600" fill="#183c34" text-anchor="middle">改进记录</text><text x="600.0" y="408" font-size="13.5" font-weight="400" fill="#496358" text-anchor="middle">每一轮一份，没有保留的也记</text><path d="M 404.0 310 V 358" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="2 7" marker-end="url(#arrow)"/><path d="M 600.0 310 V 358" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="2 7" marker-end="url(#arrow)"/><path d="M 796.0 310 V 358" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="2 7" marker-end="url(#arrow)"/><rect x="930" y="60" width="230" height="296" rx="12" fill="none" stroke="#94a99a" stroke-width="1.4" stroke-dasharray="6 6"/><text x="946" y="86" font-size="15" font-weight="400" fill="#496358" text-anchor="start">交回给人的情况</text><rect x="950" y="104" width="190" height="36" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="1045.0" y="128" font-size="15.5" font-weight="600" fill="#183c34" text-anchor="middle">原因出在评估上</text><rect x="950" y="164" width="190" height="36" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="1045.0" y="188" font-size="15.5" font-weight="600" fill="#183c34" text-anchor="middle">改动在计划之外</text><rect x="950" y="224" width="190" height="36" rx="10" fill="white" stroke="#94a99a" stroke-width="1.4"/><text x="1045.0" y="248" font-size="15.5" font-weight="600" fill="#183c34" text-anchor="middle">轮数用完仍没有改进</text><path d="M 884 103 H 922" fill="none" stroke="#496358" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="907.0" y="93" font-size="14" font-weight="400" fill="#183c34" text-anchor="middle">交回</text><text x="600" y="448" font-size="14.5" font-weight="400" fill="#496358" text-anchor="middle">评估在循环之外：提出改动的一方不给自己评分</text>
</svg>
